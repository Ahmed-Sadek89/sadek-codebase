<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070f22" />
    <meta name="robots" content="noindex" />
    <title>Offline · Ahmed Sadek</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <style>
      :root {
        color-scheme: dark;
        --background: #070f22;
        --card: #111d3a;
        --border: #233457;
        --foreground: #e6eefb;
        --muted: #9fb0cf;
        --primary: #48bdf2;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        background:
          radial-gradient(circle at 20% 15%, rgb(72 189 242 / 0.14), transparent 45%),
          radial-gradient(circle at 85% 85%, rgb(103 143 184 / 0.16), transparent 45%),
          var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgb(17 29 58 / 0.85);
        text-align: center;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.35);
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; font-size: 1.4rem; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      hr { margin: 22px auto; width: 64px; border: 0; border-top: 1px solid var(--border); }
      [lang="ar"] h1 { font-size: 1.3rem; }
      button {
        margin-top: 24px;
        min-width: 180px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #04223a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <section>
        <h1>You're offline</h1>
        <p>Check your connection. The page will reload as soon as you're back online.</p>
      </section>
      <hr />
      <section lang="ar" dir="rtl">
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>تحقق من اتصالك. ستُعاد تحميل الصفحة تلقائيًا فور عودة الاتصال.</p>
      </section>
      <button type="button" id="retry">Try again · إعادة المحاولة</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => location.reload());
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
